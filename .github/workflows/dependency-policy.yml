name: Dependency policy

on:
  pull_request:
    paths:
      - '**/.npmrc'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/pnpm-workspace.yaml'
      - '**/pnpm-lock.yaml'
      - '.tool-versions'
      - '.github/workflows/dependency-policy.yml'
      - '.github/scripts/check-override-sync.mjs'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  override-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.tool-versions'

      - name: Check npm and pnpm override maps stay identical
        run: node .github/scripts/check-override-sync.mjs

  pnpm-lockfile-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        example:
          - web/signing/signing-demo-complete
          - web/ui-customization
          - web/ui-customization-doc-editor-sidebar
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.tool-versions'

      - name: Verify committed lockfile against the supply-chain policy
        working-directory: ${{ matrix.example }}
        run: |
          corepack enable
          pnpm install --lockfile-only --frozen-lockfile --ignore-scripts

name: Dependency policy

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '**/.npmrc'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/pnpm-workspace.yaml'
      - '**/pnpm-lock.yaml'
      # Unsupported lockfile types; check-cooldown-coverage.mjs rejects these.
      - '**/yarn.lock'
      - '**/bun.lock'
      - '**/bun.lockb'
      - '**/npm-shrinkwrap.json'
      - '.tool-versions'
      - '.github/workflows/dependency-policy.yml'
      - '.github/scripts/check-override-sync.mjs'
      - '.github/scripts/check-cooldown-coverage.mjs'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      dual-manager-examples: ${{ steps.discover.outputs.examples }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.tool-versions'

      - name: Check every committed lockfile is covered by the cooldown
        run: node .github/scripts/check-cooldown-coverage.mjs

      - name: Check npm and pnpm override maps stay identical
        run: node .github/scripts/check-override-sync.mjs

      # The matrix for pnpm-lockfile-policy comes from the same discovery
      # logic check-override-sync.mjs runs its checks on, so a new
      # dual-manager example is picked up by both jobs automatically.
      - name: Discover dual-manager examples
        id: discover
        # Two statements so the node exit code fails the step; a command
        # substitution inside echo's arguments would be swallowed by echo's
        # own (always zero) exit status.
        run: |
          examples=$(node .github/scripts/check-override-sync.mjs --json)
          echo "examples=$examples" >> "$GITHUB_OUTPUT"

  pnpm-lockfile-policy:
    needs: policy-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.policy-checks.outputs.dual-manager-examples) }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.tool-versions'

      # A frozen, lockfile-only install verifies the committed lockfile still
      # matches the manifest and override maps, and — as of pnpm 11.20, with
      # trustLockfile left at its false default — re-checks minimumReleaseAge
      # against every committed lockfile entry, so a lockfile regenerated with
      # the cooldown bypassed fails here. Do not set trustLockfile: true to
      # silence such a failure; it is catching a real policy bypass.
      #
      # npm has no equivalent job: npm applies min-release-age only while
      # resolving, so `npm ci` (and `npm install` against a valid lockfile)
      # installs a cooldown-bypassing package-lock.json without complaint.
      # The npm-side lockfiles are covered by the cooldown at regeneration
      # time and by review, not by CI verification.
      - name: Verify lockfile against manifest, overrides, and cooldown
        working-directory: ${{ matrix.example }}
        run: |
          corepack enable
          pnpm install --lockfile-only --frozen-lockfile --ignore-scripts

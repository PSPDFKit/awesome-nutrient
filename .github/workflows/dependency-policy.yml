name: Dependency policy

on:
  pull_request:
    paths:
      - '**/.npmrc'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/pnpm-workspace.yaml'
      - '**/pnpm-lock.yaml'
      - '.tool-versions'
      - '.github/workflows/dependency-policy.yml'
      - '.github/scripts/check-override-sync.mjs'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  override-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.tool-versions'

      - name: Check npm and pnpm override maps stay identical
        run: node .github/scripts/check-override-sync.mjs

  pnpm-lockfile-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the dual-manager examples (directories committing
        # both package-lock.json and pnpm-lock.yaml). check-override-sync.mjs
        # discovers those automatically; this matrix is maintained by hand.
        example:
          - web/signing/signing-demo-complete
          - web/ui-customization
          - web/ui-customization-doc-editor-sidebar
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.tool-versions'

      # A frozen, lockfile-only install verifies the committed lockfile still
      # matches the manifest and override maps. It does NOT re-check
      # minimumReleaseAge: pnpm applies the cooldown only while resolving, and
      # the lockfile does not record the cooldown settings, so a lockfile
      # regenerated with the cooldown bypassed would still pass this job.
      - name: Verify lockfile matches manifest and overrides
        working-directory: ${{ matrix.example }}
        run: |
          corepack enable
          pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
